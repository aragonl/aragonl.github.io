<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>YHWH</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <header class="site-header">
    <h1>YHWH</h1>
    <p id="subtitle"></p>
  </header>

  <main id="app">
    <section id="screen-start" class="screen">
      <h2 id="start-title"></h2>
      <div class="settings-grid">
        <label><span id="players-label"></span>
          <select id="players"></select>
        </label>
        <label><span id="time-label"></span>
          <input id="turn-time" type="number" min="10" max="3600" step="10" value="120">
        </label>
        <label><span id="rounds-label"></span>
          <input id="round-total" type="number" min="1" max="20" value="3">
        </label>
      </div>

      <div class="category-selection">
        <div class="section-heading">
          <h3 id="categories-title"></h3>
          <button id="random-categories" class="secondary"></button>
        </div>
        <p id="category-count"></p>
        <div id="categories" class="category-grid"></div>
      </div>

      <button id="start-game" class="primary"></button>
      <p id="start-error" class="error"></p>
    </section>

    <section id="screen-game" class="screen hidden">
      <div class="game-top">
        <div>
          <div id="round-label"></div>
          <div id="turn-label"></div>
        </div>
        <div class="timer-controls"><div id="timer" class="timer">02:00</div><button id="pause-time" class="secondary"></button></div>
      </div>

      <div id="scoreboard" class="scoreboard"></div>

      <div id="round-card" class="round-card">
        <div id="clue-stage" class="clue-stage"></div>
        <div id="attempt-status" class="attempt-status"></div>

        <div class="guess-form">
          <div id="guess-words" class="guess-words"></div>
          <div id="guess-categories" class="guess-categories" role="group" aria-label="Categorías"></div>
          <button id="submit-guess" class="primary">RESPONDER</button>
        </div>
        <div id="feedback" class="feedback"></div>
        <div id="feedback-modal" class="feedback-modal hidden" role="alertdialog" aria-live="assertive">
          <div id="feedback-message" class="feedback"></div>
          <button id="feedback-continue" class="primary"></button>
        </div>
      </div>

      <div class="board">
        <h2 id="board-title"></h2>
        <div id="board-categories"></div>
      </div>
    </section>

    <section id="screen-reveal" class="screen hidden">
      <div class="computer-reveal">
        <div class="computer-badge" id="computer-badge"></div>
        <h2 id="reveal-title"></h2>
        <div id="revealed-word" class="revealed-word"></div>
        <div id="revealed-category" class="revealed-category"></div>
        <p id="reveal-help"></p>
        <p id="reveal-fortext"></p>
        <button id="continue-reveal" class="primary"></button>
      </div>
    </section>

    <section id="screen-end" class="screen hidden">
      <h2 id="end-title"></h2>
      <div id="final-scores"></div>
      <button id="new-game" class="primary"></button>
    </section>
  </main>

  <script type="module" src="./app.js"></script>
</body>
</html>
