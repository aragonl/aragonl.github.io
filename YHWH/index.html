<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YHWH</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <header class="site-header">
      <div class="header-top">
        <h1>YHWH</h1>
        
        <!-- Controles superiores derecha -->
        <div class="header-actions">
          <button type="button" id="info-btn" class="icon-btn" title="Información">ℹ️</button>
          <button type="button" id="settings-btn" class="icon-btn" title="Configuración">⚙️</button>
          
          <select id="lang-select" class="lang-dropdown">
            <option value="es">🇪🇸 ES</option>
            <option value="it">🇮🇹 IT</option>
            <option value="en">🇬🇧 EN</option>
          </select>
        </div>
      </div>
      <p id="subtitle" class="subtitle" data-i18n="subtitle"></p>
    </header>

    <!-- Modal de Información / Reglas -->
    <div id="rules-modal" class="feedback-modal hidden">
      <div class="feedback-box rules-box">
        <h3 data-i18n="rulesTitle"></h3>
        <ul>
          <li data-i18n="rule1"></li>
          <li data-i18n="rule2"></li>
          <li data-i18n="rule3"></li>
          <li data-i18n="rule4"></li>
        </ul>
        <button type="button" id="close-rules" class="secondary" data-i18n="continue"></button>
      </div>
    </div>

    <!-- Modal de Configuración Avanzada (⚙️) -->
    <div id="settings-modal" class="feedback-modal hidden">
      <div class="feedback-box">
        <h3 data-i18n="settingsTitle">Ajustes</h3>
        
        <div class="settings-grid" style="text-align: left; margin: 15px 0;">
          <label style="display: block; margin-bottom: 10px;">
            <span id="time-label" data-i18n="time"></span>:
            <input type="number" id="turn-time" min="10" max="120" value="120">
          </label>

          <label style="display: block; margin-bottom: 10px;">
            <span id="rounds-label" data-i18n="rounds"></span>:
            <input type="number" id="round-total" min="1" max="10" value="3">
          </label>
        </div>

        <div class="player-color-selection">
          <h4 id="player-colors-title" data-i18n="playerColorsTitle"></h4>
          <div id="player-colors" class="player-colors"></div>
          <div id="player-color-options" class="player-color-options"></div>
        </div>

        <div style="margin-top: 15px;">
          <button type="button" id="random-categories" class="secondary" data-i18n="randomCategories"></button>
        </div>

        <button type="button" id="close-settings" class="primary" style="margin-top: 15px;" data-i18n="continue"></button>
      </div>
    </div>

    <!-- Screen 1: Inicio -->
    <section id="screen-start" class="screen">
      <!-- Unico ajuste visible de entrada -->
      <div class="main-settings" style="margin-bottom: 15px;">
        <label>
          <span id="players-label" data-i18n="players"></span>:
          <select id="players"></select>
        </label>
      </div>

      <!-- Botón Comenzar ubicado ARRIBA de las categorías -->
      <button type="button" id="start-game" class="primary" style="width: 100%; font-size: 1.1rem; padding: 12px; margin-bottom: 15px;" data-i18n="startGame"></button>

      <div class="section-heading">
        <h3 id="categories-title" data-i18n="categoriesTitle"></h3>
      </div>
      <p id="category-count" class="help-text" data-i18n="categoryCount"></p>
      
      <div id="categories" class="category-grid"></div>
      <p id="start-error" class="error"></p>
    </section>

    <!-- Screen 2: Juego -->
    <main id="screen-game" class="screen hidden">
      <div class="game-top">
        <div>
          <span id="round-label"></span> | 
          <span id="turn-label"></span>
        </div>
        <div class="timer-controls">
          <button type="button" id="pause-time" class="secondary" data-i18n="pause"></button>
          <div id="timer" class="timer">02:00</div>
        </div>
      </div>

      <div id="scoreboard" class="scoreboard"></div>

      <div class="round-card">
        <div id="clue-stage" class="clue-stage">---</div>
        <div id="attempt-status" class="attempt-status"></div>

        <div class="guess-form">
          <div id="guess-words" class="guess-words"></div>
          <div id="guess-categories" class="guess-categories"></div>
          <button type="button" id="submit-guess" class="primary" data-i18n="guess"></button>
        </div>
      </div>

      <div class="board">
        <h2><span id="board-title-text" data-i18n="boardTitle"></span> (<span id="discovered-count">0</span>)</h2>
        <div id="board-categories"></div>
      </div>
    </main>

    <!-- Screen 3: Revelar Palabra -->
    <section id="screen-reveal" class="screen hidden computer-reveal">
      <span class="computer-badge" id="computer-badge" data-i18n="computer"></span>
      <h2 id="reveal-title" data-i18n="specialRound"></h2>

      <div class="reveal-table">
        <div class="reveal-row">
          <span class="reveal-label" data-i18n="revealCategoryLabel"></span>
          <strong id="revealed-category">--</strong>
        </div>
        <div class="reveal-row">
          <span class="reveal-label" data-i18n="revealFortextLabel"></span>
          <span id="reveal-fortext">--</span>
        </div>
        <div class="reveal-row">
          <span class="reveal-label" data-i18n="revealWordLabel"></span>
          <strong id="revealed-word" class="revealed-word">--</strong>
        </div>
        <div class="reveal-row">
          <span class="reveal-label" data-i18n="revealHelpLabel"></span>
          <span id="reveal-help">--</span>
        </div>
      </div>

      <button type="button" id="continue-reveal" class="primary" style="min-width: 180px;" data-i18n="continue"></button>
    </section>

    <!-- Screen 4: Fin de Juego -->
    <section id="screen-end" class="screen hidden" style="text-align: center;">
      <h2 id="end-title" data-i18n="end"></h2>
      <div id="final-scores"></div>
      <button type="button" id="new-game" class="primary" style="margin-top: 15px;" data-i18n="newGame"></button>
    </section>

    <!-- Modal Feedback -->
    <div id="feedback-modal" class="feedback-modal hidden">
      <div class="feedback-box">
        <p id="feedback-message" class="feedback"></p>
        <button type="button" id="feedback-continue" class="primary" data-i18n="continue"></button>
      </div>
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
