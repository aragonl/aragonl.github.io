<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Adivina la Palabra</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="container">
    <header>
      <div class="header-titles">
        <h1 id="title">Adivina la Palabra</h1>
        <p id="subtitle" class="subtitle"></p>
      </div>

      <div class="header-controls-right">
        <button type="button" id="config-btn" class="icon-btn" aria-label="Configuración">⚙️</button>
        <button type="button" id="info-btn" class="icon-btn" aria-label="Información">ℹ️</button>
        <select id="lang-scroll" class="lang-scroll-header" aria-label="Seleccionar idioma">
          <option value="es">Español</option>
          <option value="it">Italiano</option>
          <option value="en">English</option>
        </select>
      </div>
    </header>

    <!-- Panel de Configuración Global -->
    <div id="config-panel" class="config-panel hidden">
      <button type="button" id="close-config" class="close-panel-btn" aria-label="Cerrar">✕</button>

      <div class="config-row">
        <div class="config-group">
          <label id="players-label" for="players">Jugadores</label>
          <select id="players"></select>
        </div>

        <div class="config-group">
          <label id="time-label" for="turn-time">Tiempo por turno (s)</label>
          <input type="number" id="turn-time" value="120" min="10" step="5" />
        </div>

        <div class="config-group">
          <label id="rounds-label" for="round-total">Pistas máximas</label>
          <input type="number" id="round-total" value="3" min="1" max="5" />
        </div>

        <div class="config-group">
          <label for="config-cat-count">Categorías sugeridas</label>
          <input type="number" id="config-cat-count" value="3" min="1" />
        </div>
      </div>

      <div class="player-colors-section">
        <h4 id="player-colors-title">Nombres y colores de los jugadores</h4>
        <div id="player-colors" class="player-colors-grid"></div>
      </div>
    </div>

    <!-- PANTALLA INICIAL -->
    <div id="screen-start">
      <h2 id="start-title"></h2>

      <div class="categories-header">
        <h3 id="categories-title"></h3>
        <button type="button" id="random-categories" class="secondary-btn"></button>
      </div>
      <p id="category-count" class="category-count-text"></p>
      <div id="categories" class="categories-grid"></div>

      <button type="button" id="start-game" class="primary-btn"></button>
      <p id="start-error" class="error"></p>
    </div>

    <!-- PANTALLA DE JUEGO -->
    <div id="screen-game" class="hidden">
      <div class="game-layout">
        <!-- Columna Izquierda: Juego Activo y Revelaciones -->
        <div class="game-left-col">
          <div id="game-active-panel">
            <div class="game-top-bar">
              <span id="round-label"></span>
              <span id="turn-label"></span>
              <div class="timer-container">
                <span id="timer">02:00</span>
                <button type="button" id="pause-time" class="icon-btn-small" aria-label="Pausar">⏸</button>
              </div>
            </div>

            <div id="scoreboard" class="scoreboard"></div>

            <div class="clue-box">
              <div id="clue-stage" class="clue-stage"></div>
              <div id="attempt-status" class="attempt-status"></div>
              <button type="button" id="reveal-hint-btn" class="secondary-btn hint-btn">💡 Pedir pista (-1 pt)</button>
            </div>

            <div class="guess-box">
              <div id="guess-words" class="guess-words-container"></div>
              <div id="guess-categories" class="category-selector"></div>
              <button type="button" id="submit-guess" class="primary-btn"></button>
            </div>
          </div>

          <!-- Revelación -->
          <div id="reveal-in-column" class="hidden">
            <div class="reveal-card">
              <div class="reveal-header">
                <h3 id="reveal-title"></h3>
                <span id="computer-badge" class="badge-computer"></span>
              </div>
              <div class="reveal-body">
                <div class="reveal-row">
                  <span class="reveal-label">Categoría:</span>
                  <span id="revealed-category" class="reveal-value"></span>
                </div>
                <div class="reveal-row">
                  <span class="reveal-label">Para que exista:</span>
                  <span id="reveal-fortext" class="reveal-value"></span>
                </div>
                <div class="reveal-row">
                  <span class="reveal-label">Palabra:</span>
                  <span id="revealed-word" class="reveal-value highlight"></span>
                </div>
                <div class="reveal-row">
                  <span class="reveal-label">Pista:</span>
                  <span id="reveal-help" class="reveal-value"></span>
                </div>
              </div>
              <button type="button" id="continue-reveal" class="primary-btn"></button>
            </div>
          </div>
        </div>

        <!-- Columna Derecha: Tablero de Palabras Descubiertas -->
        <div class="game-right-col">
          <div class="board-header">
            <h2 id="board-title-text"></h2>
            <span id="discovered-count" class="discovered-count">0/0</span>
          </div>
          <div id="board-categories" class="board-grid"></div>
        </div>
      </div>
    </div>

    <!-- PANTALLA FINAL -->
    <div id="screen-end" class="hidden">
      <h2 id="end-title"></h2>
      <div id="final-scores"></div>
      <button type="button" id="new-game" class="primary-btn"></button>
    </div>
  </div>

  <!-- MODAL DE REGLAS -->
  <div id="rules-modal" class="modal hidden">
    <div class="modal-content">
      <h3 id="rules-title"></h3>
      <div class="rules-content"></div>
      <button type="button" id="close-rules" class="secondary-btn"></button>
    </div>
  </div>

  <!-- MODAL DE FEEDBACK -->
  <div id="feedback-modal" class="modal hidden">
    <div class="modal-content">
      <p id="feedback-message"></p>
      <button type="button" id="feedback-continue" class="primary-btn"></button>
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
